*{box-sizing:border-box;margin:0}
body{background:var(--paper);overflow-x:clip}
main{position:relative;min-height:100vh;overflow-x:clip;background:var(--paper);--mx:0;--my:0;--sy:0;--wp:0;transition:filter 1.2s ease}
main.night{filter:invert(1)}
.abs{position:absolute!important}
.box{border:1px solid color-mix(in oklab,var(--graphite) 60%,transparent);background:color-mix(in oklab,var(--graphite) 15%,transparent)}
.lines>i{display:block;height:8px;border-radius:9px;background:color-mix(in oklab,var(--graphite) 40%,transparent);margin-bottom:8px}
.ink{background:var(--ink)}
.frame{position:relative;background:var(--paper);border:1px solid var(--ink);outline:1px solid color-mix(in oklab,var(--ink) 25%,transparent);outline-offset:7px;box-shadow:0 30px 60px -30px color-mix(in oklab,var(--ink) 50%,transparent);overflow:hidden}
.frame::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 70px 14px color-mix(in oklab,var(--ink) 45%,transparent)}
.plate{position:absolute;inset:-60px;background:var(--im) var(--p,50% 50%)/cover;mix-blend-mode:multiply;filter:grayscale(1) contrast(1.5) brightness(1.06);translate:calc(var(--mx)*var(--d,1)*-28px) calc(var(--my)*var(--d,1)*-28px)}
.xray .plate{mix-blend-mode:difference;filter:grayscale(1) contrast(2.2) invert(1)}
@keyframes spin{to{rotate:360deg}}
.spin{animation:spin 160s linear infinite}
header{position:relative;height:0;z-index:5}
.pylon{right:6%;top:0;display:flex;width:56px;height:340px;flex-direction:column;align-items:center;justify-content:flex-end;gap:22px;padding-bottom:22px;border-radius:0 0 999px 999px;border-top:0}
.pylon i{display:block;height:8px;width:24px;border-radius:9px;background:color-mix(in oklab,var(--graphite) 55%,transparent)}
.tog{position:relative;width:34px;height:84px;border:0;border-radius:99px;background:var(--ink);cursor:pointer}
.tog b{position:absolute;left:5px;top:5px;height:24px;width:24px;border-radius:50%;background:var(--paper);transition:top .7s}
.night .tog b{top:55px}
.logo{right:calc(6% + 90px);top:230px;height:84px;width:84px;border-radius:50%}
.hero{position:relative;height:108vh;transform:rotate(calc(var(--sy)*3deg)) translateY(calc(var(--sy)*5vh));transform-origin:85% 40%}
.fan{position:absolute;left:-3%;top:8vh;width:86%;height:62vh}
.band{position:absolute;inset:0;background:var(--paper);clip-path:polygon(0 var(--a),100% var(--c),100% calc(var(--c) + 2.2%),0 var(--b))}
.fan svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fan line{stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.pt{left:calc(83% - 70px);top:calc(8vh + 31vh - 70px);width:140px;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,var(--ink) 0 2px,transparent 2px 14px)}
.pt::after{content:"";position:absolute;inset:50px;border-radius:50%;background:var(--ink)}
.speed{left:83%;right:0;top:calc(8vh + 31vh - 56px);height:112px;background:repeating-linear-gradient(0deg,var(--ink) 0 2px,transparent 2px 14px);-webkit-mask:linear-gradient(90deg,#000,transparent);mask:linear-gradient(90deg,#000,transparent)}
.bars{left:5%;bottom:5vh;width:46%}
.bars .b{height:40px;background:var(--ink);margin-bottom:12px}
.wheel{position:relative;height:300vh}
.wst{position:sticky;top:0;height:100vh;overflow:hidden}
.ringbg{left:50%;top:50%;width:min(130vh,150vw);aspect-ratio:1;translate:-50% -50%;border-radius:50%;opacity:.3;background:repeating-radial-gradient(circle,var(--ink) 0 2px,transparent 2px 36px);transform:rotateX(62deg) rotateZ(calc(var(--wp)*90deg))}
.core{left:50%;top:50%;width:90px;height:90px;translate:-50% -50%;border-radius:50%}
.port{position:absolute;left:50%;top:50%;width:min(26vw,230px);aspect-ratio:1;border-radius:50%}
.strata{position:relative;padding:20vh 0 10vh}
.slab{position:sticky;display:flex;align-items:center;gap:6%;height:58vh;width:84%;margin-bottom:46vh;background:var(--paper)}
.slab .frame{height:100%;width:70%;flex:none;clip-path:polygon(0 0,100% 7%,94% 100%,0 90%);border-radius:0}
.slab .dot{height:72px;width:72px;flex:none;border-radius:50%;background:var(--ink)}
.slab .lines{flex:1;min-width:0}
.fin{position:relative;height:120vh}
.big{right:-8%;top:8vh;width:min(86vmin,760px);aspect-ratio:1;border-radius:50%}
.stair{position:absolute;bottom:0;width:15%}
.veil{position:fixed;inset:0;z-index:50;pointer-events:none;animation:vg 0s 2.7s both}
.veil>div{position:absolute;left:0;right:0;background:oklch(.15 0 0)}
.vt{top:0;height:50%;animation:vt 1.2s 1.4s cubic-bezier(.8,0,.2,1) both}.vb{bottom:0;height:50%;animation:vb 1.2s 1.4s cubic-bezier(.8,0,.2,1) both}
.vl{top:50%;height:1px;background:oklch(.97 0 0)!important;animation:vl 1.4s cubic-bezier(.7,0,.2,1) both}
@keyframes vt{to{transform:translateY(-100%)}}@keyframes vb{to{transform:translateY(100%)}}@keyframes vg{to{visibility:hidden}}@keyframes vl{0%{transform:scaleX(0)}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@media(prefers-reduced-motion:reduce){.veil{display:none}.plate{translate:none}.hero{transform:none}.spin{animation:none}}
@media(max-width:700px){.bars{width:70%}.logo{right:calc(6% + 70px);top:240px;height:64px;width:64px}.slab{width:94%;flex-direction:column!important;height:auto;gap:18px}.slab .frame{width:100%;height:36vh}.slab .lines{width:100%}}
</style></head><body>
<div class="veil" aria-hidden="true"><div class="vt"></div><div class="vb"></div><div class="vl"></div></div>
<main id="m" aria-label="Wireframe layout study">
<header>
 <div class="abs box pylon"><i></i><i></i><i></i><button class="tog" id="tog" type="button" aria-label="Switch between day and night" aria-pressed="false"><b></b></button></div>
 <div class="abs frame logo"><div class="plate" style="--im:var(--i5);--p:55% 30%;--d:.4"></div></div>
</header>
<section class="hero">
 <div class="fan" id="fan"></div>
 <div class="abs speed" aria-hidden="true"></div><div class="abs pt spin" aria-hidden="true"></div>
 <div class="abs bars"><div class="b" style="margin-left:34%;width:66%"></div><div class="b" style="margin-left:16%;width:84%"></div><div class="b" style="width:100%"></div>
  <div class="lines" style="margin-top:28px;width:56%"><i style="width:100%"></i><i style="width:84%"></i><i style="width:68%"></i></div></div>
</section>
<section class="wheel" id="wheel"><div class="wst" style="perspective:1100px">
 <div class="abs ringbg"></div><div class="abs ink core"></div><div id="ports"></div>
 <div class="abs lines" style="left:7%;bottom:9vh;width:220px"><i style="width:100%"></i><i style="width:80%"></i></div>
 <div class="abs pill ink" style="right:7%;top:9vh;width:200px;height:48px;border-radius:99px"></div>
</div></section>
<section class="strata" id="strata"></section>
<section class="fin">
 <div class="abs frame big"><div class="plate spin" style="--im:var(--i2);--p:50% 50%;--d:.8;scale:1.7"></div></div>
 <div class="abs box" style="left:8%;top:34vh;display:flex;height:96px;width:44%;align-items:center;justify-content:space-between;border-radius:99px;padding:0 14px 0 44px"><div class="lines" style="width:50%;margin:0"><i style="width:100%"></i><i style="width:80%"></i></div><div class="ink" style="height:68px;width:68px;border-radius:50%"></div></div>
</section>
<footer class="ink" style="position:relative;height:300px;margin-top:40px">
 <div id="stairs"></div>
 <div class="abs" style="top:40px;left:6%;display:flex;gap:56px"><div class="lines" style="width:88px;margin:0"><i style="background:color-mix(in oklab,var(--graphite) 60%,transparent)"></i><i style="background:color-mix(in oklab,var(--graphite) 60%,transparent)"></i><i style="background:color-mix(in oklab,var(--graphite) 60%,transparent)"></i></div><div class="lines" style="width:88px;margin:0"><i style="background:color-mix(in oklab,var(--graphite) 60%,transparent)"></i><i style="background:color-mix(in oklab,var(--graphite) 60%,transparent)"></i></div></div>
</footer>
</main>
<script>
const $=id=>document.getElementById(id),m=$("m");
const turn=0,orders=1,wave=2,accel=3,sing=4;
const pos=["55% 78%","50% 38%","50% 50%","30% 40%","62% 72%"];
/* five streams converge on one point: each band is clipped to a wedge that narrows to the right edge */
$("fan").innerHTML=[0,1,2,3,4].map(i=>{const a=4+i*19.5,b=a+17,c=44+i*2.4;return `<div class="band" style="--a:${a}%;--b:${b}%;--c:${c}%"><div class="plate" style="--im:var(--i${i});--p:${pos[i]};--d:${1+i*.35}"></div></div>`}).join("")
 +`<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">`+[0,1,2,3,4].map(i=>{const a=4+i*19.5,b=a+17,c=44+i*2.4;return `<line x1="0" y1="${a}" x2="100" y2="${c}"/><line x1="0" y1="${b}" x2="100" y2="${c+2.2}"/>`}).join("")+`</svg>`;
$("ports").innerHTML=[0,1,2,3,4].map(i=>`<div class="port frame"><div class="plate" style="--im:var(--i${i});--p:${pos[i]};--d:.5"></div></div>`).join("");
const L=n=>`<div class="lines">`+Array.from({length:n},(_,i)=>`<i style="width:${100-i*14}%"></i>`).join("")+`</div>`;
const order=[accel,turn,orders,wave,sing];
$("strata").innerHTML=order.map((k,i)=>`<div class="slab" style="top:${6+i*5}vh;margin-left:${i%2?"14%":"2%"};${i%2?"flex-direction:row-reverse;":""}${i==4?"margin-bottom:0;":""}"><div class="frame"><div class="plate" style="--im:var(--i${k});--p:${pos[k]};--d:1.2"></div></div><div class="dot"></div>${L(3)}</div>`).join("");
$("stairs").innerHTML=[0,1,2,3,4].map(i=>`<div class="stair frame" style="left:${6+i*16}%;height:${70+i*42}px;border-radius:${i==4?"999px 999px 0 0":"0"}"><div class="plate" style="--im:var(--i${i});--p:${pos[i]};--d:.3"></div></div>`).join("");
const tog=$("tog"),setNight=n=>{m.classList.toggle("night",n);tog.setAttribute("aria-pressed",n)};
try{if(matchMedia("(prefers-color-scheme: dark)").matches)setNight(true)}catch(e){}
tog.onclick=()=>setNight(!m.classList.contains("night"));
let tx=0,ty=0,x=0,y=0,h;
addEventListener("pointermove",e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
m.addEventListener("pointerdown",()=>{h=setTimeout(()=>m.classList.add("xray"),700)});
["pointerup","pointerleave"].forEach(t=>m.addEventListener(t,()=>{clearTimeout(h);m.classList.remove("xray")}));
const wheel=$("wheel"),ports=[...document.querySelectorAll(".port")];
function orbit(p){const R=Math.min(innerWidth*.34,430);ports.forEach((el,i)=>{const a=(i/5+p*.9)*Math.PI*2,d=(Math.sin(a)+1)/2;
el.style.transform=`translate(calc(-50% + ${(Math.cos(a)*R).toFixed(1)}px),calc(-50% + ${(Math.sin(a)*R*.5).toFixed(1)}px)) scale(${(.5+d*.85).toFixed(3)})`;el.style.zIndex=Math.round(d*10)})}
(function f(){x+=(tx-x)*.06;y+=(ty-y)*.06;m.style.setProperty("--mx",x.toFixed(4));m.style.setProperty("--my",y.toFixed(4));
m.style.setProperty("--sy",Math.min(scrollY/innerHeight,1.5).toFixed(4));
const r=wheel.getBoundingClientRect(),p=Math.min(Math.max(-r.top/(r.height-innerHeight),0),1);m.style.setProperty("--wp",p.toFixed(4));orbit(p);requestAnimationFrame(f)})();
</script></body></html>
